<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emotion AI Dashboard</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <div class="sidebar">
            <div class="logo">EMO.<span>AI</span></div>
            <p class="status">SYSTEM: ONLINE</p>
        </div>

        <main class="content">
            <section class="upload-card">
                <h2>Analyze Expression</h2>
                <form method="post" enctype="multipart/form-data" id="uploadForm">
                    <label class="drop-area">
                        <input type="file" name="file" onchange="this.form.submit()" hidden>
                        <div class="upload-btn">UPLOAD IMAGE</div>
                        <p>Face focus recommended</p>
                    </label>
                </form>
            </section>

            {% if label %}
            <section class="result-display">
                <div class="image-container">
                    <img src="/static/uploads/{{ image }}" alt="Target">
                    <div class="scan-overlay"></div>
                </div>
                
                <div class="metrics">
                    <div class="metric-box">
                        <label>DETECTED EMOTION</label>
                        <h3 class="emotion-text">{{ label }}</h3>
                    </div>
                    <div class="metric-box">
                        <label>CONFIDENCE</label>
                        <div class="conf-bar"><div class="fill" style="width: {{ confidence }}"></div></div>
                        <p>{{ confidence }}</p>
                    </div>
                    <a href="/" class="clear-btn">RESET SCAN</a>
                </div>
            </section>
            {% endif %}
        </main>
    </div>
</body>
</html>
